<svg xmlns="http://www.w3.org/2000/svg" width="760" height="310" viewBox="0 0 760 310" role="img" aria-labelledby="title desc"><title id="title">iadd的抽象栈效果</title><desc id="desc">前缀S不变；两个类别1整数变为一个和；类别2值占两个容量单位。</desc><rect width="760" height="310" fill="#fff"/><g font-family="sans-serif" fill="#24313c" font-size="20"><text x="75" y="35">执行前（顶部在上）</text><text x="452" y="35">正常完成后</text><g stroke="#526271" fill="#e8edef"><rect x="80" y="60" width="210" height="52"/><rect x="80" y="112" width="210" height="52"/><rect x="80" y="164" width="210" height="52"/><rect x="450" y="112" width="210" height="52"/><rect x="450" y="164" width="210" height="52"/></g><text x="165" y="94">int b</text><text x="165" y="146">int a</text><text x="165" y="198">前缀 S</text><text x="505" y="146">int (a+b)</text><text x="520" y="198">前缀 S</text><path d="M310 140 H425 l-14 -9 m14 9 l-14 9" fill="none" stroke="#91421f" stroke-width="3"/><text x="337" y="117">iadd</text><text x="50" y="258" font-size="18">int／引用：类别1，占1容量单位；long／double：类别2，占2容量单位。</text><text x="50" y="287" font-size="18">这是规范抽象值，不是物理栈字节布局；异常出口另按异常处理规则。</text></g></svg>