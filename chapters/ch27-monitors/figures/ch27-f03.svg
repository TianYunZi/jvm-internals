<svg xmlns="http://www.w3.org/2000/svg" width="900" height="465" viewBox="0 0 900 465" role="img" aria-labelledby="title"><title id="title">当前轻量锁与膨胀：头部保存责任</title><style>text{font-family:PingFang SC,sans-serif;font-size:20px;fill:#19324a} .box{fill:#e3eef7;stroke:#537c9e;stroke-width:2} .note{fill:#f2ede4;stroke:#91421f}</style><rect width="900" height="465" fill="white"/><text x="32" y="40" font-weight="bold">当前轻量锁与膨胀：头部保存责任</text>
<rect class="box" x="35" y="75" width="830" height="65"/><text x="55" y="115">普通头字：类型等位（紧凑时）｜身份哈希｜年龄等｜锁位</text>
<rect class="box" x="35" y="170" width="400" height="90"/><text x="55" y="205">轻量获取：改变锁标记</text><text x="55" y="238">线程锁栈记录对象与重入</text>
<rect class="box" x="465" y="170" width="400" height="90"/><text x="485" y="205">膨胀：关联ObjectMonitor</text><text x="485" y="238">保存拥有者、竞争与等待</text>
<rect class="note" x="35" y="290" width="830" height="96"/><text x="55" y="325">默认无表：膨胀头可关联监视器，原头保存于监视器。</text><text x="55" y="360">紧凑头配表：头内类型须可取；表负责对象到监视器映射。</text>
<text x="35" y="430">语义空间示意；非比例位字段图；配置与第10章对应。</text>
</svg>