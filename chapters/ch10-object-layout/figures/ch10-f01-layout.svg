<svg xmlns="http://www.w3.org/2000/svg" width="960" height="680" viewBox="0 0 960 680" role="img" aria-labelledby="title"><title id="title">CH10-F01  头部缩小与对齐取整</title><rect width="960" height="680" fill="#faf9f6"/><g font-family="sans-serif" fill="#24313c"><text x="36" y="48" font-size="27" font-weight="bold">CH10-F01  头部缩小与对齐取整</text><text x="36" y="94" font-size="20">SingleInt：一个 int，单位字节</text><text x="36" y="135" font-size="20">传统</text><rect x="160" y="108" width="340" height="60" rx="5" fill="#e7eef1" stroke="#b6c5ce"/><text x="174" y="140" font-size="20">状态字 8</text><rect x="510" y="108" width="180" height="60" rx="5" fill="#e7eef1" stroke="#b6c5ce"/><text x="524" y="140" font-size="20">类型 4</text><rect x="700" y="108" width="220" height="60" rx="5" fill="#e7eef1" stroke="#b6c5ce"/><text x="714" y="140" font-size="20">number 4</text><text x="160" y="196" font-size="20">字段偏移 12；8＋4＋4＝16</text><text x="36" y="258" font-size="20">紧凑</text><rect x="160" y="230" width="340" height="60" rx="5" fill="#e7eef1" stroke="#b6c5ce"/><text x="174" y="262" font-size="20">含类型的头 8</text><rect x="510" y="230" width="180" height="60" rx="5" fill="#e7eef1" stroke="#b6c5ce"/><text x="524" y="262" font-size="20">number 4</text><rect x="700" y="230" width="220" height="60" rx="5" fill="#f1e8da" stroke="#b6c5ce"/><text x="714" y="262" font-size="20">填充 4</text><text x="160" y="320" font-size="20">字段偏移 8；8＋4＝12 → 对齐为16</text><text x="36" y="383" font-size="20">数组：紧凑头8＋长度4，元素还需要自己的对齐</text><rect x="36" y="405" width="884" height="75" rx="5" fill="#e7eef1" stroke="#b6c5ce"/><text x="50" y="437" font-size="20">byte[1]：base 12＋1 → size 16；传统 base 16＋1 → size 24</text><rect x="36" y="500" width="884" height="75" rx="5" fill="#e7eef1" stroke="#b6c5ce"/><text x="50" y="532" font-size="20">long[1]：长度后补4字节，base 16＋8 → size 24，两配置相同</text><text x="36" y="626" font-size="17">按本轮实际偏移与输出绘制；矩形不按字节比例。依据：CH10-O01。</text></g></svg>
