<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title"><title id="title">CH10-F02  两类压缩，各有基址与位移</title><rect width="960" height="560" fill="#faf9f6"/><g font-family="sans-serif" fill="#24313c"><text x="36" y="48" font-size="27" font-weight="bold">CH10-F02  两类压缩，各有基址与位移</text><text x="36" y="70" font-size="16">布局工具：Java Object Layout（JOL）；公式不代表本机实测地址</text><rect x="36" y="86" width="884" height="70" rx="5" fill="#e7eef1" stroke="#b6c5ce"/><text x="50" y="118" font-size="20">对象引用：narrowOop（本轮引用字段与引用元素宽4字节）</text><text x="55" y="203" font-size="20">零编码 → 空引用；非零 → heapBase ＋ (unsigned(code) ＜＜ oopShift)</text><text x="55" y="247" font-size="20">本轮 HotSpot 启动日志：Zero based，oopShift＝3</text><rect x="36" y="295" width="884" height="70" rx="5" fill="#e7eef1" stroke="#b6c5ce"/><text x="50" y="327" font-size="20">类型引用：narrowKlass；紧凑头先从高22位提取</text><text x="55" y="411" font-size="20">非零 → klassBase ＋ (unsigned(code) ＜＜ klassShift)</text><text x="55" y="455" font-size="20">类型与对象的基址／位移独立，不能套用 JOL 的地址猜测</text><text x="36" y="515" font-size="17">公式示意；依据：CompressedOops、CompressedKlassPointers 与 markWord。</text></g></svg>
