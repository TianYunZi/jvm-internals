<svg xmlns="http://www.w3.org/2000/svg" width="960" height="660" viewBox="0 0 960 660" role="img" aria-labelledby="title"><title id="title">CH10-F03  当前64位头部与协作责任</title><rect width="960" height="660" fill="#faf9f6"/><g font-family="sans-serif" fill="#24313c"><text x="36" y="48" font-size="27" font-weight="bold">CH10-F03  当前64位头部与协作责任</text><text x="36" y="97" font-size="20">传统压缩类型：普通头12字节</text><rect x="36" y="115" width="570" height="64" rx="5" fill="#e7eef1" stroke="#b6c5ce"/><text x="50" y="147" font-size="20">状态字8字节：哈希、年龄、同步／转发</text><rect x="620" y="115" width="300" height="64" rx="5" fill="#e7eef1" stroke="#b6c5ce"/><text x="634" y="147" font-size="20">独立类型字4字节</text><text x="36" y="231" font-size="20">紧凑：普通头8字节，以下从高位到低位</text><rect x="36" y="250" width="302" height="70" rx="5" fill="#e7eef1" stroke="#b6c5ce"/><text x="50" y="282" font-size="20">类型编码22位</text><rect x="338" y="250" width="426" height="70" rx="5" fill="#e7eef1" stroke="#b6c5ce"/><text x="352" y="282" font-size="20">身份哈希31位</text><rect x="764" y="250" width="156" height="70" rx="5" fill="#e7eef1" stroke="#b6c5ce"/><text x="778" y="282" font-size="20">其余11位</text><text x="36" y="365" font-size="20">其余11位：保留间隔4 ＋ 年龄4 ＋ 自转发1 ＋ 锁标记2</text><text x="36" y="403" font-size="20">hash_shift＝11；此图只描述普通头，不能套入任意转发中间态</text><rect x="36" y="432" width="884" height="70" rx="5" fill="#e7eef1" stroke="#b6c5ce"/><text x="50" y="464" font-size="20">同步：轻量锁与监视器表保持类型可取；身份哈希语义必须维持</text><rect x="36" y="520" width="884" height="70" rx="5" fill="#e7eef1" stroke="#b6c5ce"/><text x="50" y="552" font-size="20">移动：收集器转发、保存与恢复协议承接；不只是一幅静态位图</text><text x="36" y="629" font-size="17">依据：锁定 markWord、Arguments；本章未制造锁竞争或采集移动中间态。</text></g></svg>
