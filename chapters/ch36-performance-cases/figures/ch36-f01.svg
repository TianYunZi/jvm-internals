<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="title"><title id="title">启动与稳态分开测量</title><style>text{font:18px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#19324a}.title{font-size:24px;font-weight:650}.small{font-size:16px}.axis{stroke:#58748a;stroke-width:2}.blue{fill:#dcecf7;stroke:#517b9e}.sand{fill:#f8ead1;stroke:#a07d42}.green{fill:#deeee4;stroke:#4b8063}</style><rect width="900" height="320" fill="#fff"/><text x="30" y="38" class="title">启动与稳态分开测量</text><text x="30" y="78" class="">概念边界；训练成本不归入部署后的单次请求</text><rect x="30" y="110" width="170" height="75" rx="4" class="sand"/><text x="48" y="139" class="">部署前</text><text x="48" y="166" class="">训练／装配</text><rect x="225" y="110" width="130" height="75" rx="4" class="blue"/><text x="245" y="139" class="">进程创建</text><text x="245" y="166" class="">到入口</text><rect x="380" y="110" width="130" height="75" rx="4" class="blue"/><text x="400" y="139" class="">初始化</text><text x="400" y="166" class="">到就绪</text><rect x="535" y="110" width="150" height="75" rx="4" class="green"/><text x="555" y="139" class="">应用预热</text><text x="555" y="166" class="">画像／编译</text><rect x="710" y="110" width="160" height="75" rx="4" class="green"/><text x="730" y="139" class="">稳定指标</text><text x="730" y="166" class="">仍须定义判据</text><text x="30" y="245" class="">本轮E01取得入口／就绪和当前编译，未取得稳定期判定。</text><text x="30" y="287" class="">文件页缓存冷热、依赖准备与应用预热是不同控制条件。</text></svg>