<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-labelledby="title"><title id="title">E02：40,000次操作的三轮短区间</title><style>text{font:18px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#19324a}.title{font-size:24px;font-weight:650}.small{font-size:16px}.axis{stroke:#58748a;stroke-width:2}.blue{fill:#dcecf7;stroke:#517b9e}.sand{fill:#f8ead1;stroke:#a07d42}.green{fill:#deeee4;stroke:#4b8063}</style><rect width="900" height="380" fill="#fff"/><text x="30" y="38" class="title">E02：40,000次操作的三轮短区间</text><text x="30" y="78" class="">运行时计时，毫秒；横线表示最小—最大，圆点为三轮中位数</text><line x1="230" y1="115" x2="830" y2="115" class="axis"/><text x="230" y="105" class="">0</text><text x="470" y="105" class="">10</text><text x="710" y="105" class="">20</text><text x="30" y="167" class="">每次分配</text><line x1="635" y1="160" x2="756" y2="160" class="axis"/><circle cx="639" cy="160" r="7" fill="#517b9e"/><text x="250" y="194" class="">16.88 / 17.06 / 21.91 ms</text><text x="30" y="247" class="">复用数组</text><line x1="291" y1="240" x2="338" y2="240" class="axis"/><circle cx="299" cy="240" r="7" fill="#4b8063"/><text x="250" y="274" class="">2.56 / 2.87 / 4.49 ms</text><text x="30" y="321" class="">线程分配：164,800,016 B → 约320,016—320,984 B（含结果向量）</text><text x="30" y="359" class="small">日志含热身：年轻代暂停11 → 0；不外推稳定吞吐或总处理器同比收益。</text></svg>