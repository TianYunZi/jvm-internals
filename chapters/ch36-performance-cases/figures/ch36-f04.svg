<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" role="img" aria-labelledby="title"><title id="title">容量账本之间没有简单相等式</title><style>text{font:18px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#19324a}.title{font-size:24px;font-weight:650}.small{font-size:16px}.axis{stroke:#58748a;stroke-width:2}.blue{fill:#dcecf7;stroke:#517b9e}.sand{fill:#f8ead1;stroke:#a07d42}.green{fill:#deeee4;stroke:#4b8063}</style><rect width="900" height="350" fill="#fff"/><text x="30" y="38" class="title">容量账本之间没有简单相等式</text><text x="30" y="80" class="">嵌套框表达预算范围，不表示实测比例或精确包含关系</text><rect x="30" y="105" width="840" height="150" rx="4" class="blue"/><text x="52" y="136" class="">进程预算：堆、栈、元空间、代码、回收结构、本地库及安全余量</text><rect x="65" y="160" width="220" height="65" rx="4" class="green"/><text x="85" y="198" class="">Java堆上限</text><rect x="320" y="160" width="500" height="65" rx="4" class="sand"/><text x="340" y="198" class="">运行时本地分类及外部资源生命周期</text><text x="30" y="293" class="">NMT保留／提交 ≠ 系统RSS；cgroup还可能计入同组进程与文件页。</text><text x="30" y="333" class="small">本轮Other释放8192 KB，而同进程RSS未同步同比下降。</text></svg>