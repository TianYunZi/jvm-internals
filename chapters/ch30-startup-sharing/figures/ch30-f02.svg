<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="title desc"><title id="title">归档映射与进程私有状态</title><desc id="desc">同一归档映射到两个进程，共享目标是可复用数据，线程和可变状态分别建立。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#385b7d"/></marker></defs><rect width="960" height="400" fill="#fff"/><g font-family="PingFang SC,sans-serif" font-size="20" fill="#24313c"><rect x="300" y="20" width="360" height="90" rx="8" fill="#e3eef7" stroke="#537c9e"/><text x="480" y="56" text-anchor="middle">同一归档文件</text><text x="480" y="86" text-anchor="middle">类元数据及受支持的归档对象</text><path d="M400 110L250 180M560 110L710 180" stroke="#385b7d" stroke-width="2" marker-end="url(#a)"/><g fill="#f7fafc" stroke="#537c9e"><rect x="40" y="180" width="400" height="175" rx="8"/><rect x="520" y="180" width="400" height="175" rx="8"/></g><text x="240" y="214" text-anchor="middle">进程甲：各自的虚拟地址空间</text><text x="720" y="214" text-anchor="middle">进程乙：各自的虚拟地址空间</text><text x="240" y="256" text-anchor="middle">映射区：只读共享／可写私有化</text><text x="720" y="256" text-anchor="middle">映射区：只读共享／可写私有化</text><text x="240" y="299" text-anchor="middle">本进程的线程、句柄、可变业务状态</text><text x="720" y="299" text-anchor="middle">本进程的线程、句柄、可变业务状态</text><text x="480" y="386" text-anchor="middle" font-size="17">逻辑空间示意，非地址比例；映射成功不等于每页已经驻留或都可物理共享</text></g></svg>
