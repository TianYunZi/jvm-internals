<svg xmlns="http://www.w3.org/2000/svg" width="900" height="655" viewBox="0 0 900 655" role="img" aria-labelledby="title desc">
<title id="title">CH04-F03 方法控制流、异常表与属性</title>
<desc id="desc">parseOrDefault 方法空值分支返回字段数值，否则调用 Integer.parseInt。异常保护区间为偏移 12 至 16，不含 16，匹配 NumberFormatException 时到偏移 17。栈映射位于偏移 12 和 17，调试信息另行记录。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#526271"/></marker></defs>
<rect width="900" height="655" fill="white"/>
<g font-family="-apple-system, PingFang SC, sans-serif" font-size="18" fill="#24313c">
<text x="30" y="37" font-size="23" font-weight="600">CH04-F03 · 同一个方法，三种互补的信息</text>
<text x="30" y="67" fill="#526271">CH04-E01 parseOrDefault；max_stack=1，max_locals=3</text>
<g fill="#edf1f3" stroke="#b5c3cc">
<rect x="45" y="105" width="350" height="65" rx="5"/><rect x="45" y="229" width="350" height="65" rx="5"/>
<rect x="485" y="229" width="350" height="65" rx="5"/><rect x="485" y="350" width="350" height="65" rx="5"/>
<rect x="45" y="465" width="790" height="66" rx="5"/><rect x="45" y="548" width="790" height="66" rx="5"/>
</g>
<text x="61" y="133">0: aload_1</text><text x="61" y="159">1: ifnonnull 12</text>
<text x="61" y="257">4—8: 读取 value 并转为 int</text><text x="61" y="283">11: ireturn</text>
<text x="501" y="257">12: aload_1；13: parseInt</text><text x="501" y="283">16: ireturn</text>
<text x="501" y="378">17: astore_2；18—22: 回退</text><text x="501" y="404">25: ireturn</text>
<g fill="none" stroke="#526271" stroke-width="2" marker-end="url(#arrow)">
<path d="M220 170V223"/><path d="M395 139H660V223"/>
<path d="M660 294V344" stroke="#91421f"/>
</g>
<text x="233" y="204">input 为空</text><text x="520" y="128">input 非空</text>
<text x="75" y="335" font-size="17" fill="#91421f">异常表：[12,16) → 17</text>
<text x="75" y="365" font-size="17" fill="#91421f">类型：NumberFormatException</text>
<text x="61" y="493">StackMapTable：偏移 12 的栈为空；偏移 17 的栈含异常引用</text>
<text x="61" y="519" font-size="16" fill="#526271">验证使用的类型状态；不是本次运行捕获的值，也不是堆转储。</text>
<text x="61" y="576">LineNumberTable、LocalVariableTable、LocalVariableTypeTable</text>
<text x="61" y="602" font-size="16" fill="#526271">源码位置、变量槽的有效范围与泛型调试信息；不负责异常跳转。</text>
<text x="45" y="642" font-size="16" fill="#526271">实线是可能的控制流，不是实测执行轨迹。依据：规范 §4.7.3—4.7.4、§4.7.12—4.7.14。</text>
</g></svg>
