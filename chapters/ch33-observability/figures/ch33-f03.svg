<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="title"><title id="title">事件、快照与计数的不同时间口径</title><style>text{font:18px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#19324a}.title{font-size:24px;font-weight:650}.small{font-size:16px}.axis{stroke:#58748a;stroke-width:2}.blue{fill:#dcecf7;stroke:#517b9e}.sand{fill:#f8ead1;stroke:#a07d42}.green{fill:#deeee4;stroke:#4b8063}</style><rect width="900" height="320" fill="#fff"/><text x="30" y="38" class="title">事件、快照与计数的不同时间口径</text><line x1="180" y1="80" x2="840" y2="80" class="axis"/><text x="190" y="68" class="">时间向右；仅为概念示意，无实测刻度</text><text x="30" y="130" class="">事件区间</text><rect x="300" y="100" width="350" height="42" rx="4" class="blue"/><text x="330" y="127" class="">开始 → 持续活动 → 结束</text><text x="30" y="200" class="">结构快照</text><line x1="370" y1="160" x2="370" y2="215" class="axis"/><line x1="700" y1="160" x2="700" y2="215" class="axis"/><text x="350" y="240" class="">时点A</text><text x="680" y="240" class="">时点B</text><text x="30" y="285" class="">累计计数</text><text x="220" y="285" class="">值B − 值A：只在未重置、相同范围时解释该窗口增量</text></svg>