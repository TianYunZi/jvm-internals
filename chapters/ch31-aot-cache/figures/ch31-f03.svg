<svg xmlns="http://www.w3.org/2000/svg" width="960" height="350" viewBox="0 0 960 350" role="img" aria-labelledby="title desc"><title id="title">启动、就绪与稳定阶段的不同边界</title><desc id="desc">训练和装配发生在部署前。部署进程的创建、入口、就绪与稳定性能是不同时间点，稳定点本轮未测。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#385b7d"/></marker></defs><rect width="960" height="350" fill="white"/><g font-family="PingFang SC,sans-serif" font-size="20" fill="#24313c"><rect x="30" y="25" width="410" height="65" rx="8" fill="#f2ede4"/><text x="235" y="65" text-anchor="middle">部署前成本：训练 ＋ 缓存装配</text><path d="M60 190H900" stroke="#385b7d" stroke-width="3" marker-end="url(#a)"/><g stroke="#537c9e" stroke-width="2"><path d="M100 165V215M340 165V215M570 165V215M820 165V215"/></g><text x="100" y="150" text-anchor="middle">创建进程</text><text x="340" y="150" text-anchor="middle">进入main</text><text x="570" y="150" text-anchor="middle">应用就绪</text><text x="820" y="150" text-anchor="middle">稳定性能？</text><text x="220" y="255" text-anchor="middle">初始化与入口准备</text><text x="460" y="255" text-anchor="middle">应用自身准备</text><text x="700" y="255" text-anchor="middle">画像、编译与业务预热</text><text x="480" y="318" text-anchor="middle" font-size="17">概念时间线，无实测刻度；本轮程序有阶段标记，未定义或测定稳定性能时点</text></g></svg>
