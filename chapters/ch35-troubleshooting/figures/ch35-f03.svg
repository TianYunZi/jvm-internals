<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" role="img" aria-labelledby="title"><title id="title">业务延迟与虚拟机暂停的边界</title><style>text{font:18px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#19324a}.title{font-size:24px;font-weight:650}.small{font-size:16px}.axis{stroke:#58748a;stroke-width:2}.blue{fill:#dcecf7;stroke:#517b9e}.sand{fill:#f8ead1;stroke:#a07d42}.green{fill:#deeee4;stroke:#4b8063}</style><rect width="900" height="350" fill="#fff"/><text x="30" y="38" class="title">业务延迟与虚拟机暂停的边界</text><text x="30" y="80" class="">示意：并行的区间不可简单相加；无实测比例</text><text x="30" y="145" class="">业务端到端</text><rect x="240" y="112" width="580" height="48" rx="4" class="blue"/><text x="260" y="143" class="">排队／调度　+　执行　+　资源等待</text><text x="30" y="220" class="">安全点相关</text><rect x="320" y="188" width="200" height="48" rx="4" class="sand"/><rect x="520" y="188" width="260" height="48" rx="4" class="blue"/><text x="335" y="218" class="">到达／同步</text><text x="555" y="218" class="">暂停内工作</text><text x="30" y="300" class="">并发回收</text><rect x="240" y="268" width="360" height="46" rx="4" class="green"/><text x="260" y="298" class="">可与业务执行重叠，竞争处理器和带宽</text><text x="30" y="338" class="small">分配等待需单独定位；整个回收周期不等于全体线程暂停。</text></svg>