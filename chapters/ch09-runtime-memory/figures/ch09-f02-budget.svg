<svg xmlns="http://www.w3.org/2000/svg" width="960" height="660" viewBox="0 0 960 660" role="img" aria-labelledby="title"><title id="title">CH09-F02  空间状态与容量清单</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#175a7c"/></marker></defs><rect width="100%" height="100%" fill="#faf9f6"/><g font-family="sans-serif" fill="#24313c"><text x="40" y="48" font-size="27" font-weight="bold">CH09-F02  空间状态与容量清单</text><text x="36" y="70" font-size="16">驻留集大小（Resident Set Size，RSS）；数值保留原工具单位</text><rect x="40" y="80" width="330" height="92" rx="8" fill="#e7eef1" stroke="#c1ccd1"/><text x="58" y="112" font-size="19">预留 reserved</text><text x="58" y="138" font-size="19">先占虚拟地址范围</text><rect x="440" y="80" width="480" height="92" rx="8" fill="#f1e8da" stroke="#c1ccd1"/><text x="458" y="112" font-size="19">提交 committed</text><text x="458" y="138" font-size="19">按操作系统规则使部分范围可用</text><path d="M378,126 H430" stroke="#175a7c" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="200" width="330" height="92" rx="8" fill="#e7eef1" stroke="#c1ccd1"/><text x="58" y="232" font-size="19">提交之后：可选预触碰</text><text x="58" y="258" font-size="19">触碰与提交是不同步骤</text><rect x="440" y="200" width="480" height="92" rx="8" fill="#f1e8da" stroke="#c1ccd1"/><text x="458" y="232" font-size="19">驻留 resident</text><text x="458" y="258" font-size="19">当前物理驻留受访问、回收与共享映射影响</text><path d="M378,246 H430" stroke="#175a7c" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="320" width="330" height="92" rx="8" fill="#e7eef1" stroke="#c1ccd1"/><text x="58" y="352" font-size="19">对象容量 H 之外还有成本</text><text x="58" y="378" font-size="19">线程 S、类型 M、代码 C</text><rect x="440" y="320" width="480" height="92" rx="8" fill="#f1e8da" stroke="#c1ccd1"/><text x="458" y="352" font-size="19">收集器辅助 G、本地资源 N、系统与余量 R</text><text x="458" y="378" font-size="19">按相同口径归账；避免重复计入明细</text><path d="M378,366 H430" stroke="#175a7c" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="440" width="330" height="92" rx="8" fill="#e7eef1" stroke="#c1ccd1"/><text x="58" y="472" font-size="19">本轮堆 reserved 131072K</text><text x="58" y="498" font-size="19">committed 34816K；used 5594K</text><rect x="440" y="440" width="480" height="92" rx="8" fill="#f1e8da" stroke="#c1ccd1"/><text x="458" y="472" font-size="19">ps RSS 59248 × 1024 字节</text><text x="458" y="498" font-size="19">相邻时点；不能精确相减得到“本地泄漏”</text><path d="M378,486 H430" stroke="#175a7c" stroke-width="2" marker-end="url(#arrow)"/><text x="40" y="600" font-size="17">机制与本轮摘录合图；矩形不按比例。依据：VirtualSpace、CH02-O02、工具手册。</text></g></svg>
