<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc"><title id="title">内存段的空间与时间边界</title><desc id="desc">12字节本地段包含3个4字节整数，切片缩小空间边界；关闭Arena终止所有相关段的有效期。</desc><rect width="960" height="420" fill="white"/><g font-family="PingFang SC,sans-serif" font-size="20" fill="#24313c"><text x="40" y="40">空间：CH32-E02 的 12 字节本地段（本机整数布局）</text><g stroke="#537c9e" fill="#e3eef7"><rect x="120" y="75" width="240" height="65"/><rect x="360" y="75" width="240" height="65"/><rect x="600" y="75" width="240" height="65"/></g><text x="240" y="116" text-anchor="middle">int 2：偏移 0—3</text><text x="480" y="116" text-anchor="middle">int 3：偏移 4—7</text><text x="720" y="116" text-anchor="middle">int 5：偏移 8—11</text><path d="M360 155V173H600V155" fill="none" stroke="#91421f" stroke-width="3"/><text x="480" y="203" text-anchor="middle">示意切片：asSlice(4, 4)，仍共享同一作用域</text><text x="40" y="260">时间：分配后可按线程与边界访问</text><rect x="120" y="285" width="480" height="50" fill="#e3eef7" stroke="#537c9e"/><rect x="600" y="285" width="240" height="50" fill="#f2ede4" stroke="#91421f"/><text x="360" y="318" text-anchor="middle">作用域存活：受检查的托管访问</text><text x="720" y="318" text-anchor="middle">关闭后不可再访问</text><path d="M600 275V345" stroke="#91421f" stroke-width="3"/><text x="600" y="378" text-anchor="middle">Arena.close：段与切片一起失效；不延长已交给本地库的裸指针生命期</text></g></svg>
