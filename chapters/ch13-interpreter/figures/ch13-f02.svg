<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" role="img" aria-labelledby="title desc">
<title id="title">逻辑方法状态与解释栈帧</title><desc id="desc">示意布局不规定内存增长方向或固定偏移</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#385b7d"/></marker></defs><rect width="960" height="580" fill="#f7fafc"/>
<g font-family="system-ui,sans-serif" fill="#19324a">
<text x="36" y="42" font-size="25" font-weight="700">逻辑方法状态与解释栈帧</text>
<text x="36" y="77" font-size="17">示意布局不规定内存增长方向或固定偏移</text>
<rect x="55" y="120" width="345" height="110" rx="10" fill="#e3eef7" stroke="#537c9e" stroke-width="2"/>
<text x="71" y="151" font-size="18">调用者main</text>
<text x="71" y="178" font-size="18">调用点与返回续点</text>
<text x="71" y="205" font-size="18">调用者帧／栈指针</text>
<rect x="55" y="285" width="345" height="145" rx="10" fill="#e3eef7" stroke="#537c9e" stroke-width="2"/>
<text x="71" y="316" font-size="18">当前middle</text>
<text x="71" y="343" font-size="18">局部变量：mode、异常临时值</text>
<text x="71" y="370" font-size="18">操作数栈：调用参数／异常对象</text>
<text x="71" y="397" font-size="18">Method、字节码位置、监视器信息</text>
<rect x="530" y="120" width="365" height="115" rx="10" fill="#e3eef7" stroke="#537c9e" stroke-width="2"/>
<text x="546" y="151" font-size="18">规范方法状态</text>
<text x="546" y="178" font-size="18">局部变量数组＋操作数栈</text>
<text x="546" y="205" font-size="18">正常返回或异常完成</text>
<rect x="530" y="300" width="365" height="130" rx="10" fill="#e3eef7" stroke="#537c9e" stroke-width="2"/>
<text x="546" y="331" font-size="18">编译形态可能内联</text>
<text x="546" y="358" font-size="18">一个物理帧含多个逻辑方法</text>
<text x="546" y="385" font-size="18">依靠调试／去优化元数据恢复</text>
<polyline points="220,230 220,285" fill="none" stroke="#385b7d" stroke-width="2" marker-end="url(#a)"/>
<text x="240" y="267" font-size="16">调用</text>
<polyline points="400,353 470,353 470,180 530,180" fill="none" stroke="#385b7d" stroke-width="2" marker-end="url(#a)"/>
<text x="425" y="255" font-size="16">实现映射</text>
<polyline points="715,235 715,300" fill="none" stroke="#385b7d" stroke-width="2" marker-end="url(#a)"/>
<text x="737" y="279" font-size="16">优化后</text>
<text x="36" y="508" font-size="17">异常对象中的栈踪迹可以记录已经退出的方法；不是捕获瞬间的物理栈快照。</text>
<text x="36" y="533" font-size="17">long／double占两个规范局部槽；规范槽数不直接给出机器帧字节数。</text>
</g></svg>