<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="title"><title id="title">同一墙钟区间内的执行和等待</title><style>text{font:18px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#19324a}.title{font-size:24px;font-weight:650}.small{font-size:16px}.axis{stroke:#58748a;stroke-width:2}.blue{fill:#dcecf7;stroke:#517b9e}.sand{fill:#f8ead1;stroke:#a07d42}.green{fill:#deeee4;stroke:#4b8063}</style><rect width="900" height="300" fill="#fff"/><text x="30" y="38" class="title">同一墙钟区间内的执行和等待</text><text x="30" y="78" class="">仅为记账示意，不表示本轮实测比例</text><text x="30" y="142" class="">墙钟经过</text><rect x="220" y="110" width="180" height="50" rx="4" class="blue"/><rect x="400" y="110" width="270" height="50" rx="4" class="sand"/><rect x="670" y="110" width="150" height="50" rx="4" class="blue"/><text x="255" y="142" class="">执行</text><text x="462" y="142" class="">等待／未调度</text><text x="700" y="142" class="">执行</text><text x="30" y="222" class="">处理器时间</text><rect x="220" y="190" width="180" height="50" rx="4" class="blue"/><rect x="400" y="190" width="150" height="50" rx="4" class="blue"/><text x="580" y="222" class="">只累计获得处理器的部分</text><text x="30" y="280" class="small">方法追踪与自定义事件还取决于各自begin／结束边界。</text></svg>