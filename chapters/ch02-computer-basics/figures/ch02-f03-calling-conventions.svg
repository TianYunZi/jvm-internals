<svg xmlns="http://www.w3.org/2000/svg" width="900" height="565" viewBox="0 0 900 565" role="img" aria-labelledby="t d"><title id="t">CH02-F03 参数寄存器、调用栈与逻辑帧</title><desc id="d">普通本地整数调用在 AArch64 中用 x0 至 x7，在本章比较的 x86-64 非 Windows 约定中用六个参数寄存器；栈保存溢出参数和必要现场。Java 内部调用有自己的约定，逻辑帧不固定等于物理帧。</desc><rect width="900" height="565" fill="white"/>
<g font-family="-apple-system, PingFang SC, sans-serif" font-size="18" fill="#24313c"><text x="30" y="38" font-size="23" font-weight="600">CH02-F03 · 调用约定规定边界，不固定全部函数体</text>
<g fill="#edf1f3" stroke="#b5c3cc"><rect x="40" y="89" width="395" height="141" rx="5"/><rect x="465" y="89" width="395" height="141" rx="5"/><rect x="40" y="278" width="395" height="185" rx="5"/><rect x="465" y="278" width="395" height="185" rx="5"/></g>
<text x="57" y="122">AArch64 普通本地整数参数</text><text x="57" y="158">x0、x1、…、x7</text><text x="57" y="192">简单整数返回：x0</text><text x="57" y="220" font-size="16">Apple 栈指针要求 16 字节对齐</text>
<text x="482" y="122">x86-64 非 Windows 比较分支</text><text x="482" y="158">rdi、rsi、rdx、rcx、r8、r9</text><text x="482" y="192">简单整数返回：rax</text><text x="482" y="220" font-size="16">本轮只读规范／源码，未在该架构运行</text>
<text x="57" y="311">本地栈的可能组成</text><text x="57" y="348">超出寄存器容量的参数</text><text x="57" y="382">必要的返回地址／保存寄存器</text><text x="57" y="416">溢出值、局部存储与对齐空间</text><text x="57" y="449" font-size="16">保存位置和帧省略依架构与优化判断</text>
<text x="482" y="311">Java 的逻辑调用</text><text x="482" y="348">源码方法 A → B → C</text><text x="482" y="382">可被内联到更少的物理帧</text><text x="482" y="416">局部值可能在寄存器或按需重建</text><text x="482" y="449" font-size="16">进入本地边界时再完成相应调用适配</text>
<text x="40" y="501" fill="#91421f">适用范围：普通标量整数参数；不将此表用于全部聚合、浮点或可变参数。</text><text x="40" y="545" font-size="16" fill="#526271">据 Arm 调用标准、Apple 平台说明与锁定 HotSpot 参数寄存器定义自绘，不是本次调用栈原图。</text></g></svg>
