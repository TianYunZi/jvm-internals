<svg xmlns="http://www.w3.org/2000/svg" width="900" height="570" viewBox="0 0 900 570" role="img" aria-labelledby="t d"><title id="t">CH02-F01 虚拟地址转换与缺页</title><desc id="d">进程地址包含虚拟页号与页内偏移，经转换缓存或页表关联物理页；不存在可用映射时由操作系统处理缺页。保留地址不等于物理页已驻留。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#526271"/></marker></defs><rect width="900" height="570" fill="white"/>
<g font-family="-apple-system, PingFang SC, sans-serif" font-size="18" fill="#24313c"><text x="30" y="38" font-size="23" font-weight="600">CH02-F01 · 地址存在，不等于物理页已经驻留</text>
<g fill="#edf1f3" stroke="#b5c3cc"><rect x="40" y="92" width="270" height="76" rx="5"/><rect x="365" y="92" width="225" height="76" rx="5"/><rect x="645" y="92" width="215" height="76" rx="5"/><rect x="365" y="266" width="225" height="86" rx="5"/><rect x="645" y="266" width="215" height="86" rx="5"/><rect x="40" y="421" width="820" height="87" rx="5"/></g>
<text x="57" y="123">进程虚拟地址</text><text x="57" y="153">虚拟页号 + 页内偏移</text><text x="382" y="123">地址转换缓存／页表</text><text x="382" y="153">权限与映射关系</text><text x="662" y="123">物理页 + 原偏移</text><text x="662" y="153">访问实际内存</text>
<text x="382" y="297">映射缺失或权限异常</text><text x="382" y="327">进入系统处理路径</text><text x="662" y="297">建立／恢复映射</text><text x="662" y="327">或报告非法访问</text>
<g fill="none" stroke="#526271" stroke-width="2" marker-end="url(#a)"><path d="M310 130H358"/><path d="M590 130H638"/><path d="M477 168V259"/><path d="M590 309H638"/><path d="M752 266V175"/></g>
<text x="493" y="222">无法直接完成</text><text x="45" y="395" fill="#91421f">虚拟内存的几种观察口径</text><text x="57" y="453">预留：占住地址范围；提交：满足对应实现的可用性条件</text><text x="57" y="486">驻留：此时有物理页在内存中；对象已用量又是另一层统计</text>
<text x="40" y="548" font-size="16" fill="#526271">机制示意；未观察物理页号，不指定所有平台的页大小或提交实现，缺页也不总意味着磁盘读取。</text></g></svg>
